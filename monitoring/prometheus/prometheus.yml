global:
  scrape_interval: 10s
  evaluation_interval: 10s

scrape_configs:
  # LabLend Flask application (HTTP + business metrics)
  - job_name: lablend
    metrics_path: /metrics
    static_configs:
      - targets: ["web:5000"]

  # Host CPU, memory and disk metrics
  - job_name: node
    static_configs:
      - targets: ["node-exporter:9100"]

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
